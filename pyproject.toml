[project]
name = "langgraph-llm-compiler"
version = "0.1.0"
description = "Framework-agnostic LLM Compiler core with LangGraph adapters (Compiler & ReAct)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain-core>=1.8.3",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.23",
    "pydantic>=2.14.4",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["llm_compiler", "langgraph_adapters"]

[dependency-groups]
dev = [
    "grandalf>=0.8",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
