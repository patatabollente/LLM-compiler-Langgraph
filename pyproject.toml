[project]
name = "langgraph-llm-compiler"
version = "0.1.0"
description = "LLM Compiler with DAG orchestration implemented using LangGraph"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain-core>=1.8.3",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.23",
    "pydantic>=2.14.4",
]

[project.scripts]
langgraph-llm-compiler = "langgraph_llm_compiler:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "grandalf>=0.8",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

